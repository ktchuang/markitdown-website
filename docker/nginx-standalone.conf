server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pyodide 314+ ships ES modules (pyodide.mjs, pyodide.asm.mjs). The stock
    # mime.types has no .mjs, and browsers refuse module scripts served as
    # application/octet-stream. Same merge pattern as nginx.conf.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location ~* ^/(pyodide|wheels)/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # URL-conversion backend not run in this standalone setup.
    location /api/ { return 503; }

    location / { try_files $uri $uri/ /index.html; }
}
